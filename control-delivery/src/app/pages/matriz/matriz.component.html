<app-menu></app-menu>

<div class="container-fluid pt-3">

    <div class="page-header">
        <div class="page-title">
            <div class="icon">🏢</div>
            <div>
                <h1>Dados da Empresa</h1>
                <h1 class="title"></h1>
            </div>
        </div>
    </div>

    <form *ngIf="matriz" #matrizForm="ngForm">
        <div class="card-dados">

            <div class="row g-3">

                <!-- ID -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>ID da Matriz</label>
                        <input type="number" class="form-control" [disabled]="true" [(ngModel)]="matriz.idMatriz"
                            name="idMatriz">
                    </div>
                </div>

                <!-- Nome -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Nome da Empresa</label>
                        <input type="text" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.nome" name="nome">
                    </div>
                </div>

                <!-- Logradouro -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.logradouro" name="logradouro">
                    </div>
                </div>

                <!-- Telefone -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="tel" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.telefone" name="telefone">
                    </div>
                </div>

                <!-- CNPJ -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.cnpj" name="cnpj">
                    </div>
                </div>

                <!-- Email -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.email" name="email">
                    </div>
                </div>

                <!-- Latitude -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="text" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.latitude" name="latitude">
                    </div>
                </div>

                <!-- Longitude -->
                <div class="col-12 col-md-6">
                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="text" class="form-control" [disabled]="!permiteAlterarDados"
                            [(ngModel)]="matriz.longitude" name="longitude">
                    </div>
                </div>

            </div>

            <!-- Botão -->
            <div class="d-flex justify-content-end mt-4">
                <app-button textButton="Atualizar Dados" [disabled]="!permiteAlterarDados" (click)="salvar()">
                </app-button>
            </div>

        </div>
    </form>
</div>
